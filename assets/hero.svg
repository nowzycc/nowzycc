<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Nagato Hikari — Job-native observability for HTC/HPC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.45" stop-color="#0A1024"/>
      <stop offset="1" stop-color="#160B2E"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0F7FF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#6366F1" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>

    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>

    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="360" fill="url(#fadeRight)"/>
    </mask>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="360" fill="url(#dotgrid)" opacity="0.7"/>

  <!-- ambient glows -->
  <g filter="url(#soft)">
    <circle cx="1120" cy="40" r="170" fill="url(#glowViolet)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="330" r="190" fill="url(#glowCyan)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scanline -->
  <g opacity="0.5">
    <rect x="0" y="-30" width="1280" height="26" fill="url(#beam)" opacity="0.35">
      <animate attributeName="y" values="-40;380" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD corners -->
  <g stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1224 28 H1252 V56"/>
    <path d="M28 304 V332 H56"/>
    <path d="M1224 332 H1252 V304"/>
  </g>

  <!-- signal beam to lens -->
  <g>
    <path d="M700 180 H860" stroke="url(#beam)" stroke-width="1.4" stroke-dasharray="7 9">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="700" cy="180" r="3" fill="#7DF9FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- lens / aperture -->
  <g transform="translate(1020 180)">
    <circle r="150" fill="none" stroke="#A78BFA" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="150" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"
            stroke-dasharray="3 16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </circle>

    <circle r="118" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.85" stroke-width="2"/>
    <circle r="118" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="8"
            stroke-dasharray="1 59" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <circle cx="118" cy="0" r="4" fill="#7DF9FF"/>
      <circle cx="0" cy="118" r="3" fill="#F472B6" opacity="0.9"/>
      <circle cx="-83" cy="-83" r="2.5" fill="#A78BFA"/>
    </g>

    <circle r="86" fill="#05070F" fill-opacity="0.65" stroke="#22D3EE" stroke-opacity="0.25"/>
    <g stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1">
      <path d="M-104 0 H-86 M86 0 H104 M0 -104 V-86 M0 86 V104"/>
    </g>

    <circle r="70" fill="url(#core)" opacity="0.7">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="#060A16" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle r="46" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1"
            stroke-dasharray="10 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- aperture blades -->
    <g fill="#A78BFA" fill-opacity="0.10" stroke="#7DF9FF" stroke-opacity="0.45" stroke-width="1">
      <path d="M0 -46 L24 -12 L12 22 L-12 22 L-24 -12 Z"/>
    </g>
    <circle r="5" fill="#E0F7FF">
      <animate attributeName="r" values="3.5;6;3.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>

    <text y="168" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="11" letter-spacing="4" fill="#94A3B8" opacity="0.8">JOB-GRAINED SIGNAL</text>
  </g>

  <!-- text block -->
  <g font-family="'Inter', 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">
    <text x="84" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="15" fill="#7DF9FF" opacity="0.9">nowzycc@ihep ~ % whoami
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="80" y="176" font-size="66" font-weight="800" letter-spacing="2.5" fill="url(#nameGrad)" filter="url(#textGlow)">
      NAGATO HIKARI
    </text>

    <rect x="84" y="198" width="520" height="1" fill="url(#ringGrad)" opacity="0.65"/>

    <text x="84" y="234" font-size="19" fill="#C7D2FE" letter-spacing="0.4">
      Job-native observability · HTC/HPC workload profiling
    </text>

    <text x="84" y="262" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="13" fill="#8B95B5" letter-spacing="3.2">MEASURE · PROFILE · SIMULATE · CC.IHEP.CAS</text>

    <!-- tags -->
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12">
      <g>
        <rect x="84" y="292" width="96" height="28" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="132" y="311" text-anchor="middle" fill="#A5F3FC">JobLens</text>
      </g>
      <g>
        <rect x="190" y="292" width="72" height="28" rx="14" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.45"/>
        <text x="226" y="311" text-anchor="middle" fill="#DDD6FE">eBPF</text>
      </g>
      <g>
        <rect x="272" y="292" width="104" height="28" rx="14" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
        <text x="324" y="311" text-anchor="middle" fill="#FBCFE8">HTCondor</text>
      </g>
      <g>
        <rect x="386" y="292" width="168" height="28" rx="14" fill="#818CF8" fill-opacity="0.10" stroke="#818CF8" stroke-opacity="0.45"/>
        <text x="470" y="311" text-anchor="middle" fill="#C7D2FE">workload profiling</text>
      </g>
    </g>
  </g>

  <!-- bottom rule -->
  <rect x="0" y="358" width="1280" height="2" fill="url(#ringGrad)" opacity="0.8"/>
</svg>
