<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Nagato Hikari, job-native observability for HTC/HPC">
  <rect width="1280" height="340" fill="#0D1117"/>

  <!-- editorial rules -->
  <line x1="64" y1="40" x2="1216" y2="40" stroke="#21262D" stroke-width="1"/>
  <line x1="64" y1="300" x2="1216" y2="300" stroke="#21262D" stroke-width="1"/>

  <!-- eyebrow -->
  <text x="64" y="72" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="3.4" fill="#8B949E">CC.IHEP.CAS / HTC-HPC SYSTEMS</text>

  <!-- name -->
  <text x="60" y="156" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="300" letter-spacing="0.5" fill="#F0F6FC">Nagato Hikari</text>

  <!-- rule -->
  <line x1="64" y1="182" x2="544" y2="182" stroke="#F0F6FC" stroke-width="1.2"/>

  <!-- subtitle -->
  <text x="64" y="214" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#8B949E">Job-native observability &amp; workload profiling</text>

  <!-- keywords -->
  <text x="64" y="246" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#8B949E">eBPF&#160;&#160;/&#160;&#160;C++&#160;&#160;/&#160;&#160;HTCondor&#160;&#160;/&#160;&#160;Elasticsearch</text>

  <!-- slogan -->
  <text x="64" y="286" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="3.4" fill="#8B949E" opacity="0.85">MEASURE&#160;&#160;·&#160;&#160;PROFILE&#160;&#160;·&#160;&#160;SIMULATE</text>

  <!-- line-art signal -->
  <g transform="translate(1012 168)" fill="none" stroke-linecap="round">
    <line x1="-165" y1="0" x2="-132" y2="0" stroke="#21262D" stroke-width="1"/>
    <line x1="132" y1="0" x2="165" y2="0" stroke="#21262D" stroke-width="1"/>
    <line x1="0" y1="-138" x2="0" y2="-126" stroke="#21262D" stroke-width="1"/>
    <line x1="0" y1="126" x2="0" y2="138" stroke="#21262D" stroke-width="1"/>

    <circle r="118" stroke="#21262D" stroke-width="1"/>
    <circle r="82" stroke="#21262D" stroke-width="1"/>
    <circle r="46" stroke="#F0F6FC" stroke-width="1.2"/>

    <circle r="118" stroke="#58A6FF" stroke-width="1.2" stroke-dasharray="2 26" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </circle>

    <circle cx="118" cy="0" r="3.4" fill="#F0F6FC" stroke="none"/>
    <circle cx="0" cy="118" r="2.6" fill="#8B949E" stroke="none"/>
    <circle cx="-71" cy="-41" r="2.6" fill="#8B949E" stroke="none"/>
    <circle cx="58" cy="-58" r="2.2" fill="#58A6FF" stroke="none"/>

    <circle r="2.6" fill="#F0F6FC" stroke="none">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- measured signal inside the core -->
    <polyline points="-30,8 -22,-6 -14,3 -6,-12 2,2 10,-16 18,-2 26,6" stroke="#F0F6FC" stroke-width="1" opacity="0.75"/>
  </g>

  <text x="1012" y="330" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="9" letter-spacing="3" fill="#8B949E">JOB-GRAINED SIGNAL</text>
</svg>
