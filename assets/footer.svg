<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Measure, profile, simulate">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="fgGlow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1280" height="150" fill="#05070F"/>
  <circle cx="640" cy="150" r="180" fill="url(#fgGlow)" filter="url(#fsoft)"/>

  <path d="M0 96 C160 64 280 128 440 104 C600 80 720 132 880 108 C1040 84 1160 118 1280 92 V150 H0 Z" fill="url(#wave2)"/>
  <path d="M0 116 C150 92 300 140 470 120 C640 100 760 142 930 122 C1080 104 1180 130 1280 112 V150 H0 Z" fill="url(#wave1)"/>

  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="74" font-size="13" letter-spacing="6" fill="#C7D2FE" opacity="0.9">MEASURE · PROFILE · SIMULATE</text>
    <text x="640" y="97" font-size="10" letter-spacing="3" fill="#8B95B5" opacity="0.8">NAGATO HIKARI / CC.IHEP.CAS</text>
  </g>

  <rect x="0" y="0" width="1280" height="1.5" fill="url(#fg)" opacity="0.65"/>
</svg>
